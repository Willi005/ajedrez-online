<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gambito: ajedrez para dos jugadores sobre sockets TCP. Sin cuentas: se emparejan con un token." />
    <meta name="theme-color" content="#f3f2f2" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('ajedrez.theme');
          var isDark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#151413');
          }
        } catch (_) {}
      })();
    </script>
    <title>Gambito · ajedrez en línea</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
